apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-valid
  labels:
    team: devops
    env: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
        team: devops
        env: prod
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"